<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026知识竞赛-刷题</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#333; }

/* ===== Pages ===== */
.page { display:none; min-height:100vh; }
.page.active { display:block; }

/* ===== Home Page ===== */
#homePage { background:linear-gradient(135deg,#4a90d9,#357abd); min-height:100vh; }
.home-header { text-align:center; padding:48px 20px 30px; color:#fff; }
.home-header h1 { font-size:24px; margin-bottom:8px; }
.home-header p { font-size:13px; opacity:0.85; }
.home-stats { display:flex; justify-content:center; gap:12px; margin-top:20px; }
.home-stats .stat { background:rgba(255,255,255,0.18); border-radius:10px; padding:12px 18px; text-align:center; }
.home-stats .stat .num { font-size:22px; font-weight:700; }
.home-stats .stat .label { font-size:11px; opacity:0.8; margin-top:2px; }

.home-menu { max-width:480px; margin:0 auto; padding:0 16px 30px; }
.menu-item { background:#fff; border-radius:12px; margin-bottom:12px; padding:18px 20px; display:flex; align-items:center; cursor:pointer; transition:transform 0.15s; }
.menu-item:active { transform:scale(0.98); }
.menu-item .icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; margin-right:14px; flex-shrink:0; }
.menu-item .text { flex:1; }
.menu-item .text h3 { font-size:16px; margin-bottom:3px; }
.menu-item .text p { font-size:12px; color:#999; }
.menu-item .arrow { color:#ccc; font-size:20px; }

/* ===== Quiz Page ===== */
#quizPage { background:#f0f2f5; }
.quiz-topbar { position:sticky; top:0; z-index:10; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.quiz-progress { height:4px; background:#e8e8e8; }
.quiz-progress .bar { height:4px; background:#4a90d9; transition:width 0.3s; border-radius:0 2px 2px 0; }
.quiz-nav { display:flex; align-items:center; padding:10px 16px; }
.quiz-nav .back { font-size:22px; color:#666; cursor:pointer; width:30px; }
.quiz-nav .title { flex:1; text-align:center; font-size:15px; font-weight:600; }
.quiz-nav .count { font-size:13px; color:#999; width:60px; text-align:right; }
.quiz-nav .mode-badge { display:inline-block; background:#ff6b6b; color:#fff; font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px; }

.quiz-body { max-width:600px; margin:0 auto; padding:16px; padding-bottom:80px; }
.q-type-tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:4px; margin-bottom:10px; }
.q-type-tag.single { background:#e3f0ff; color:#1890ff; }
.q-type-tag.multi { background:#fff7e6; color:#fa8c16; }
.q-type-tag.judge { background:#f6ffed; color:#52c41a; }
.q-category { font-size:11px; color:#bbb; margin-bottom:6px; }
.q-question { font-size:17px; line-height:1.7; margin-bottom:20px; }

.q-options { }
.q-option { background:#fff; border:2px solid #eee; border-radius:10px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:flex-start; cursor:pointer; transition:all 0.2s; }
.q-option:active { transform:scale(0.98); }
.q-option .letter { width:28px; height:28px; border-radius:50%; border:2px solid #ddd; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; margin-right:12px; flex-shrink:0; transition:all 0.2s; }
.q-option .content { flex:1; font-size:15px; line-height:1.5; }
.q-option.selected { border-color:#4a90d9; }
.q-option.selected .letter { border-color:#4a90d9; background:#4a90d9; color:#fff; }
.q-option.correct { border-color:#52c41a; background:#f6ffed; }
.q-option.correct .letter { border-color:#52c41a; background:#52c41a; color:#fff; }
.q-option.wrong { border-color:#ff4d4f; background:#fff1f0; }
.q-option.wrong .letter { border-color:#ff4d4f; background:#ff4d4f; color:#fff; }
.q-option.disabled { pointer-events:none; }

.judge-options { display:flex; gap:12px; }
.judge-options .q-option { flex:1; justify-content:center; }

.q-feedback { margin-top:16px; border-radius:10px; padding:14px 16px; display:none; }
.q-feedback.show { display:block; }
.q-feedback.correct { background:#f6ffed; border:1px solid #b7eb8f; }
.q-feedback.wrong { background:#fff1f0; border:1px solid #ffa39e; }
.q-feedback .fb-title { font-size:15px; font-weight:700; margin-bottom:4px; }
.q-feedback.correct .fb-title { color:#52c41a; }
.q-feedback.wrong .fb-title { color:#ff4d4f; }
.q-feedback .fb-answer { font-size:13px; color:#666; }
.q-feedback .fb-answer b { color:#333; }

.quiz-bottom { position:fixed; bottom:0; left:0; right:0; background:#fff; box-shadow:0 -1px 4px rgba(0,0,0,0.06); display:flex; padding:10px 16px; max-width:600px; margin:0 auto; }
.quiz-bottom button { flex:1; padding:12px; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
.btn-confirm { background:#4a90d9; color:#fff; margin-right:8px; }
.btn-confirm:disabled { background:#ccc; }
.btn-next { background:#4a90d9; color:#fff; }
.btn-next.hidden { display:none; }

/* ===== Wrong Removal Button ===== */
.btn-remove-wrong { background:#fff; color:#ff4d4f; border:1px solid #ff4d4f; margin-right:8px; flex:1; }
.btn-remove-wrong.hidden { display:none; }
.btn-confirm.hidden { display:none; }

/* ===== Result Page ===== */
#resultPage { background:#f0f2f5; min-height:100vh; }
.result-card { max-width:400px; margin:40px auto; background:#fff; border-radius:16px; padding:30px; text-align:center; }
.result-card .score { font-size:48px; font-weight:700; color:#4a90d9; margin-bottom:8px; }
.result-card .score-label { font-size:14px; color:#999; margin-bottom:24px; }
.result-stats { display:flex; justify-content:center; gap:20px; margin-bottom:24px; }
.result-stats .item { text-align:center; }
.result-stats .item .v { font-size:20px; font-weight:700; }
.result-stats .item .l { font-size:11px; color:#999; }
.result-card button { width:100%; padding:12px; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:8px; }
.result-card .btn-home { background:#4a90d9; color:#fff; }
.result-card .btn-retry { background:#fff; color:#4a90d9; border:1px solid #4a90d9; }

/* ===== Category Filter ===== */
.cat-filter { max-width:600px; margin:0 auto; padding:16px; }
.cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.cat-card { background:#fff; border-radius:10px; padding:14px; text-align:center; cursor:pointer; transition:all 0.15s; }
.cat-card:active { transform:scale(0.96); }
.cat-card .name { font-size:14px; margin-bottom:4px; }
.cat-card .cnt { font-size:12px; color:#999; }
.cat-card.selected { background:#4a90d9; color:#fff; }
.cat-card.selected .cnt { color:rgba(255,255,255,0.8); }

.section-title { font-size:14px; color:#666; margin-bottom:10px; margin-top:6px; }

@media(max-width:400px){
  .home-header h1 { font-size:20px; }
  .q-question { font-size:15px; }
  .q-option .content { font-size:14px; }
}
/* ===== Toast Notification ===== */
.toast-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:2000; display:none; align-items:center; justify-content:center; }
.toast-overlay.active { display:flex; }
.toast-box { background:#fff; border-radius:12px; padding:24px 28px; max-width:280px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,0.2); }
.toast-box p { font-size:15px; color:#333; margin-bottom:18px; line-height:1.5; }
.toast-box button { padding:8px 28px; border:none; border-radius:6px; background:#4a90d9; color:#fff; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<!-- ===== Home Page ===== -->
<div id="homePage" class="page active">
  <div class="home-header">
    <h1>2026知识竞赛题库</h1>
    <p>共202题 · 全部单选题</p>
    <div class="home-stats">
      <div class="stat"><div class="num" id="statAnswered">0</div><div class="label">已刷题</div></div>
      <div class="stat"><div class="num" id="statAccuracy">--</div><div class="label">正确率</div></div>
      <div class="stat"><div class="num" id="statWrong">0</div><div class="label">错题数</div></div>
    </div>
  </div>
  <div class="home-menu">
    <div class="menu-item" onclick="startQuiz('sequential')">
      <div class="icon" style="background:#e3f0ff;color:#1890ff;">&#128218;</div>
      <div class="text"><h3>顺序刷题</h3><p id="seqMenuDesc">按题号顺序逐题练习</p></div>
      <div class="arrow">&#8250;</div>
    </div>
    <div class="menu-item" onclick="showCategoryFilter()">
      <div class="icon" style="background:#fff7e6;color:#fa8c16;">&#127919;</div>
      <div class="text"><h3>分类刷题</h3><p>按知识分类专项练习</p></div>
      <div class="arrow">&#8250;</div>
    </div>
    <div class="menu-item" onclick="startQuiz('wrong')">
      <div class="icon" style="background:#fff1f0;color:#ff4d4f;">&#10060;</div>
      <div class="text"><h3>错题练习</h3><p id="wrongMenuDesc">还没有错题</p></div>
      <div class="arrow">&#8250;</div>
    </div>
    <div class="menu-item" onclick="startQuiz('random')">
      <div class="icon" style="background:#f6ffed;color:#52c41a;">&#127922;</div>
      <div class="text"><h3>随机刷题</h3><p>随机打乱全部题目</p></div>
      <div class="arrow">&#8250;</div>
    </div>
    <div class="menu-item" onclick="resetProgress()">
      <div class="icon" style="background:#f0f0f0;color:#999;">&#128465;</div>
      <div class="text"><h3>重置进度</h3><p>清除所有答题记录和错题</p></div>
      <div class="arrow">&#8250;</div>
    </div>
  </div>
</div>

<!-- ===== Category Filter Page ===== -->
<div id="categoryPage" class="page">
  <div class="quiz-topbar">
    <div class="quiz-nav">
      <div class="back" onclick="showPage('homePage')">&#8249;</div>
      <div class="title">选择分类</div>
      <div class="count"></div>
    </div>
  </div>
  <div class="cat-filter">
    <div class="section-title">选择要练习的分类</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>
</div>

<!-- ===== Quiz Page ===== -->
<div id="quizPage" class="page">
  <div class="quiz-topbar">
    <div class="quiz-progress"><div class="bar" id="progressBar" style="width:0%"></div></div>
    <div class="quiz-nav">
      <div class="back" onclick="exitQuiz()">&#8249;</div>
      <div class="title"><span id="quizTitle">顺序刷题</span><span class="mode-badge" id="wrongModeBadge" style="display:none;">错题模式</span></div>
      <div class="count" id="quizCount">1/202</div>
    </div>
  </div>
  <div class="quiz-body">
    <div class="q-category" id="qCategory"></div>
    <span class="q-type-tag" id="qType"></span>
    <div class="q-question" id="qQuestion"></div>
    <div class="q-options" id="qOptions"></div>
    <div class="q-feedback" id="qFeedback"></div>
  </div>
  <div class="quiz-bottom" id="quizBottom">
    <button class="btn-confirm" id="btnConfirm" onclick="confirmAnswer()">确认</button>
    <button class="btn-remove-wrong hidden" id="btnRemoveWrong" onclick="removeCurrentWrong()">已掌握，移除</button>
    <button class="btn-next hidden" id="btnNext" onclick="nextQuestion()">下一题</button>
  </div>
</div>

<!-- ===== Result Page ===== -->
<div id="resultPage" class="page">
  <div class="result-card">
    <div class="score" id="resultScore">--</div>
    <div class="score-label">本次得分</div>
    <div class="result-stats">
      <div class="item"><div class="v" id="resultTotal">0</div><div class="l">总题数</div></div>
      <div class="item"><div class="v" id="resultRight">0</div><div class="l">答对</div></div>
      <div class="item"><div class="v" id="resultWrong">0</div><div class="l">答错</div></div>
    </div>
    <button class="btn-home" onclick="showPage('homePage');updateHomeStats()">返回首页</button>
    <button class="btn-retry" id="btnRetry" onclick="retryQuiz()">再练一次</button>
  </div>
</div>

// ===== State =====
let state = {
  mode: 'sequential',
  queue: [],
  currentIdx: 0,
  selectedAnswers: [],
  answered: false,
  sessionRight: 0,
  sessionWrong: 0,
  wrongSet: [],
  answeredSet: [],
  selectedCategory: null,
  seqProgress: 0
};

// ===== Persistence =====
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem('quizState')||'{}');
    state.wrongSet = s.wrongSet||[];
    state.answeredSet = s.answeredSet||[];
    state.seqProgress = s.seqProgress||0;
  }catch(e){}
}
function saveState(){
  localStorage.setItem('quizState',JSON.stringify({wrongSet:state.wrongSet,answeredSet:state.answeredSet,seqProgress:state.seqProgress}));
}

// ===== Navigation =====
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== Home Stats =====
function updateHomeStats(){
  document.getElementById('statAnswered').textContent = state.answeredSet.length;
  document.getElementById('statWrong').textContent = state.wrongSet.length;
  const total = state.answeredSet.length;
  if(total>0){
    let rightCount = 0;
    state.answeredSet.forEach(i=>{
      if(!state.wrongSet.includes(i)) rightCount++;
    });
    const acc = Math.round(rightCount/total*100);
    document.getElementById('statAccuracy').textContent = acc+'%';
  }else{
    document.getElementById('statAccuracy').textContent = '--';
  }
  const wrongDesc = document.getElementById('wrongMenuDesc');
  if(state.wrongSet.length>0){
    wrongDesc.textContent = '当前'+state.wrongSet.length+'道错题待练习';
  }else{
    wrongDesc.textContent = '还没有错题';
  }
  const seqDesc = document.getElementById('seqMenuDesc');
  if(state.seqProgress>0 && state.seqProgress<202){
    seqDesc.textContent = '已刷到第'+(state.seqProgress+1)+'题，点击继续';
  }else if(state.seqProgress>=202){
    seqDesc.textContent = '已全部刷完，点击重新开始';
  }else{
    seqDesc.textContent = '按题号顺序逐题练习';
  }
}

// ===== Start Quiz =====
function startQuiz(mode){
  state.mode = mode;
  state.currentIdx = 0;
  state.sessionRight = 0;
  state.sessionWrong = 0;
  state.selectedCategory = null;

  if(mode==='sequential'){
    state.queue = QUESTIONS.map((q,i)=>i);
    document.getElementById('quizTitle').textContent = '顺序刷题';
    document.getElementById('wrongModeBadge').style.display='none';
    if(state.seqProgress>0 && state.seqProgress<state.queue.length){
      state.currentIdx = state.seqProgress;
    }else{
      state.currentIdx = 0;
      state.seqProgress = 0;
    }
  }else if(mode==='wrong'){
    if(state.wrongSet.length===0){
      showToast('还没有错题，先去刷题吧！');
      return;
    }
    state.queue = [...state.wrongSet];
    document.getElementById('quizTitle').textContent = '错题练习';
    document.getElementById('wrongModeBadge').style.display='inline-block';
  }else if(mode==='random'){
    state.queue = QUESTIONS.map((q,i)=>i).sort(()=>Math.random()-0.5);
    document.getElementById('quizTitle').textContent = '随机刷题';
    document.getElementById('wrongModeBadge').style.display='none';
  }

  showPage('quizPage');
  renderQuestion();
}

// ===== Category Filter =====
function showCategoryFilter(){
  const cats = {};
  QUESTIONS.forEach(q=>{
    const c = q.category||'未分类';
    if(!cats[c]) cats[c]=0;
    cats[c]++;
  });
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  Object.keys(cats).sort().forEach(c=>{
    const div = document.createElement('div');
    div.className = 'cat-card';
    div.innerHTML = '<div class="name">'+c+'</div><div class="cnt">'+cats[c]+'题</div>';
    div.onclick = ()=>{
      document.querySelectorAll('.cat-card').forEach(el=>el.classList.remove('selected'));
      div.classList.add('selected');
      state.selectedCategory = c;
    };
    grid.appendChild(div);
  });
  const btnDiv = document.createElement('div');
  btnDiv.style.gridColumn = '1/-1';
  btnDiv.style.marginTop = '16px';
  btnDiv.innerHTML = '<button style="width:100%;padding:12px;border:none;border-radius:8px;background:#4a90d9;color:#fff;font-size:15px;font-weight:600;cursor:pointer;" onclick="startCategoryQuiz()">开始练习</button>';
  grid.appendChild(btnDiv);
  showPage('categoryPage');
}

function startCategoryQuiz(){
  if(!state.selectedCategory){
    showToast('请先选择一个分类');
    return;
  }
  state.mode = 'category';
  state.currentIdx = 0;
  state.sessionRight = 0;
  state.sessionWrong = 0;
  state.queue = QUESTIONS.map((q,i)=>i).filter(i=>QUESTIONS[i].category===state.selectedCategory);
  document.getElementById('quizTitle').textContent = state.selectedCategory;
  document.getElementById('wrongModeBadge').style.display='none';
  showPage('quizPage');
  renderQuestion();
}

// ===== Render Question =====
function renderQuestion(){
  if(state.currentIdx >= state.queue.length){
    showResult();
    return;
  }

  const qi = state.queue[state.currentIdx];
  const q = QUESTIONS[qi];
  state.selectedAnswers = [];
  state.answered = false;

  const pct = (state.currentIdx/state.queue.length)*100;
  document.getElementById('progressBar').style.width = pct+'%';
  document.getElementById('quizCount').textContent = (state.currentIdx+1)+'/'+state.queue.length;

  document.getElementById('qCategory').textContent = q.category||'';

  const typeEl = document.getElementById('qType');
  if(q.type==='单选题'){ typeEl.className='q-type-tag single'; typeEl.textContent='单选题'; }
  else if(q.type==='多选题'){ typeEl.className='q-type-tag multi'; typeEl.textContent='多选题'; }
  else if(q.type==='判断题'){ typeEl.className='q-type-tag judge'; typeEl.textContent='判断题'; }

  document.getElementById('qQuestion').textContent = q.question;

  const optEl = document.getElementById('qOptions');
  optEl.innerHTML = '';
  document.getElementById('qFeedback').classList.remove('show','correct','wrong');
  document.getElementById('btnConfirm').classList.remove('hidden');
  document.getElementById('btnConfirm').disabled = true;
  document.getElementById('btnConfirm').textContent = '确认';
  document.getElementById('btnNext').classList.add('hidden');
  document.getElementById('btnRemoveWrong').classList.add('hidden');
  document.getElementById('btnRemoveWrong').textContent = '已掌握，移除';
  document.getElementById('btnRemoveWrong').disabled = false;

  if(q.type==='判断题'){
    optEl.className = 'q-options judge-options';
    const opts = [
      {letter:'A', text:'正确'},
      {letter:'B', text:'错误'}
    ];
    opts.forEach(o=>{
      const div = document.createElement('div');
      div.className = 'q-option';
      div.innerHTML = '<div class="letter">'+o.letter+'</div><div class="content">'+o.text+'</div>';
      div.onclick = ()=>toggleOption(div,o.letter,q.type);
      optEl.appendChild(div);
    });
  }else if(Array.isArray(q.options) && q.options.length>0 && typeof q.options[0]==='object'){
    // New format: array of objects [{letter:'A',text:'...'}, ...]
    optEl.className = 'q-options';
    q.options.forEach(o=>{
      const div = document.createElement('div');
      div.className = 'q-option';
      div.innerHTML = '<div class="letter">'+o.letter+'</div><div class="content">'+o.text+'</div>';
      div.onclick = ()=>toggleOption(div,o.letter,q.type);
      optEl.appendChild(div);
    });
  }else{
    // Old format: string with newline-separated options
    optEl.className = 'q-options';
    const optLines = (typeof q.options==='string') ? q.options.split('\n') : [];
    optLines.forEach((line,idx)=>{
      const match = line.match(/^([A-Z])\.?\s*(.*)/);
      if(!match) return;
      const letter = match[1];
      const text = match[2];
      const div = document.createElement('div');
      div.className = 'q-option';
      div.innerHTML = '<div class="letter">'+letter+'</div><div class="content">'+text+'</div>';
      div.onclick = ()=>toggleOption(div,letter,q.type);
      optEl.appendChild(div);
    });
  }
}

// ===== Toggle Option =====
function toggleOption(el,letter,type){
  if(state.answered) return;
  if(type==='单选题'||type==='判断题'){
    document.querySelectorAll('#qOptions .q-option').forEach(o=>o.classList.remove('selected'));
    el.classList.add('selected');
    state.selectedAnswers = [letter];
    document.getElementById('btnConfirm').disabled = false;
  }else{
    el.classList.toggle('selected');
    if(el.classList.contains('selected')){
      if(!state.selectedAnswers.includes(letter)) state.selectedAnswers.push(letter);
    }else{
      state.selectedAnswers = state.selectedAnswers.filter(l=>l!==letter);
    }
    document.getElementById('btnConfirm').disabled = state.selectedAnswers.length===0;
  }
}

// ===== Confirm Answer =====
function confirmAnswer(){
  if(state.answered) return;
  if(state.selectedAnswers.length===0) return;
  state.answered = true;

  const qi = state.queue[state.currentIdx];
  const q = QUESTIONS[qi];
  const correctAnswers = q.answer.split('').sort();
  const userAnswers = [...state.selectedAnswers].sort();
  const isCorrect = JSON.stringify(correctAnswers)===JSON.stringify(userAnswers);

  const options = document.querySelectorAll('#qOptions .q-option');
  options.forEach(opt=>{
    const letter = opt.querySelector('.letter').textContent;
    opt.classList.add('disabled');
    if(correctAnswers.includes(letter)){
      opt.classList.add('correct');
    }else if(userAnswers.includes(letter) && !correctAnswers.includes(letter)){
      opt.classList.add('wrong');
    }
  });

  const fb = document.getElementById('qFeedback');
  fb.classList.add('show');
  if(isCorrect){
    fb.classList.add('correct');
    fb.innerHTML = '<div class="fb-title">&#10004; 回答正确</div>';
    state.sessionRight++;
  }else{
    fb.classList.add('wrong');
    fb.innerHTML = '<div class="fb-title">&#10008; 回答错误</div><div class="fb-answer">正确答案：<b>'+q.answer+'</b></div>';
    state.sessionWrong++;
    if(!state.wrongSet.includes(qi)) state.wrongSet.push(qi);
  }

  if(!state.answeredSet.includes(qi)) state.answeredSet.push(qi);
  saveState();

  document.getElementById('btnConfirm').classList.add('hidden');
  document.getElementById('btnNext').classList.remove('hidden');

  if(state.wrongSet.includes(qi)){
    document.getElementById('btnRemoveWrong').classList.remove('hidden');
  }
}

// ===== Next Question =====
function nextQuestion(){
  state.currentIdx++;
  if(state.mode==='sequential'){
    state.seqProgress = state.currentIdx;
    saveState();
  }
  renderQuestion();
}

// ===== Remove Wrong (manual) =====
function removeCurrentWrong(){
  const qi = state.queue[state.currentIdx];
  state.wrongSet = state.wrongSet.filter(i=>i!==qi);
  saveState();
  document.getElementById('btnRemoveWrong').textContent = '已移除';
  document.getElementById('btnRemoveWrong').disabled = true;
  setTimeout(()=>{
    state.currentIdx++;
    if(state.mode==='sequential'){
      state.seqProgress = state.currentIdx;
      saveState();
    }
    renderQuestion();
  },500);
}

// ===== Result =====
function showResult(){
  const total = state.queue.length;
  const right = state.sessionRight;
  const wrong = state.sessionWrong;
  const score = total>0 ? Math.round(right/total*100) : 0;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultTotal').textContent = total;
  document.getElementById('resultRight').textContent = right;
  document.getElementById('resultWrong').textContent = wrong;
  if(state.mode==='sequential'){
    state.seqProgress = 0;
    saveState();
  }
  showPage('resultPage');
  updateHomeStats();
}

function retryQuiz(){
  startQuiz(state.mode);
}

// ===== Exit =====
function exitQuiz(){
  if(state.mode==='sequential'){
    state.seqProgress = state.currentIdx;
    saveState();
    showPage('homePage');
    updateHomeStats();
  }else{
    if(confirm('确定退出本次刷题吗？')){
      showPage('homePage');
      updateHomeStats();
    }
  }
}

// ===== Reset =====
function resetProgress(){
  if(confirm('确定要清除所有答题记录和错题吗？此操作不可恢复。')){
    state.wrongSet = [];
    state.answeredSet = [];
    state.seqProgress = 0;
    saveState();
    updateHomeStats();
    showToast('已重置所有进度');
  }
}


// ===== Toast =====
function showToast(msg){
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastOverlay').classList.add('active');
}
function hideToast(e){
  if(e && e.target && e.target.id !== 'toastOverlay' && e.target.tagName !== 'BUTTON') return;
  document.getElementById('toastOverlay').classList.remove('active');
}

// ===== Init =====
loadState();
updateHomeStats();
</script>

<!-- ===== Toast ===== -->
<div class="toast-overlay" id="toastOverlay" onclick="hideToast(event)">
  <div class="toast-box" onclick="event.stopPropagation()">
    <p id="toastMsg"></p>
    <button onclick="hideToast()">知道了</button>
  </div>
</div>
</body>
